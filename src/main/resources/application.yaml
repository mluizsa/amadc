server:
  connection-timeout: 60000
spring:
  application:
    name: amadc
  datasource:
    url: jdbc:postgresql://localhost:5432/amadc
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Crucial: O Flyway cuidará da criação, o Hibernate apenas valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
     max-file-size: 10MB
     max-request-size: 50MB
logging:
  level:
    org.hibernate.envers: WARN
    root: INFO
      # Silencia o bloco azul HHH10001005 (Informações da Database)
    org.hibernate.orm.connections.pooling: WARN
    # Silencia outros logs de inicialização verbosos do Hibernate
    org.hibernate.engine.jdbc.connections.internal: WARN
    org.hibernate.orm.connections.access: WARN
    org.hibernate.dialect: WARN
    # Reduz o ruído do Flyway e do pool Hikari
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    # Mantém o Spring Security em WARN como você já tem
    org.springframework.security: WARN

# ESTE BLOCO DEVE FICAR NA RAIZ (FORA DO BLOCO SPRING)
api:
  security:
    token:
      secret: ${JWT_SECRET}