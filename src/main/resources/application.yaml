spring:
  application:
    name: amadc
  datasource:
    url: jdbc:postgresql://localhost:5432/amadc
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Crucial: O Flyway cuidará da criação, o Hibernate apenas valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  logging:
    level:
      org.springframework.security: DEBUG

# ESTE BLOCO DEVE FICAR NA RAIZ (FORA DO BLOCO SPRING)
api:
  security:
    token:
      secret: ${JWT_SECRET}